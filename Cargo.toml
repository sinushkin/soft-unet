[package]
name = "soft-unet"
version = "0.1.0"
edition = "2024"

[dependencies]
opencv = { version = "0.97.2", features = ["imgcodecs", "imgproc", "highgui", "clang-runtime"] }
anyhow = { version = "1.0.100", features = ["backtrace"] }
log = "0.4.1"
rayon = "1.10"
rand = "0.8.5"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
base64 = "0.22"

[dev-dependencies]