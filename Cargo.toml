[package]
name = "soft-unet"
version = "0.1.0"
edition = "2024"

[dependencies]
opencv = { version = "0.97.2", features = ["imgcodecs", "imgproc", "highgui", "clang-runtime"] }
anyhow = { version = "1.0.100", features = ["backtrace"] }
log = "0.4.1"
rayon = "1.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
base64 = "0.22"
env_logger = { version = "0.11.8" }
num_cpus = "1.17.0"
crossbeam-channel = "0.5.15"
